name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt
      - run: pytest -m "not integration"

  compose-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: cp .env.template .env && docker compose config -q
      - name: Build images
        run: docker compose build

  proxy-image:
    # The backup proxy image that "Deploy a proxy VM" pulls onto the new VM. Published under the
    # repository owner's namespace on every push to master and on version tags, so the default
    # image name in backup/deploy.py resolves. GitHub creates the package private on first push:
    # set it to public once under the package's settings, or every deployment is refused.
    if: github.event_name == 'push'
    needs: [unit-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hcm-proxy" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n "s/^VERSION = '\(.*\)'/\1/p" proxy/identity.py)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./proxy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
