version: '3.8'

# =============================================================================
# RESOURCE LIMITS — READ BEFORE CHANGING
# =============================================================================
# Each service has a 'deploy.resources.limits' block defining its maximum CPU
# and memory allocation. These are hard limits enforced by the kernel via
# cgroups — a container cannot exceed them regardless of host availability.
#
# IMPORTANT: The sum of all CPU limits must not exceed the number of physical
# CPU cores available to Docker on the host. Exceeding this causes containers
# to compete for the same cores, increasing latency across the entire stack.
#
# Tuned for a 2-CPU host.
#
#   Always-on services:
#     influxdb:  0.75 CPU   768MB
#     balancer:  1.50 CPU  1024MB  <- dominant consumer during predictive runs
#     collector: 0.25 CPU   128MB
#     dashboard: 0.25 CPU   256MB
#     postgres:  0.25 CPU   256MB  <- shared config store (replaces SQLite volume)
#
#   Profile-conditional (sentinel / full):
#     sentinel:  0.50 CPU   512MB
#
#   Optional (tools profile):
#     grafana:   0.25 CPU   128MB
#
# Total limits intentionally exceed physical cores because the Oracle (balancer
# spike) and Sentinel analysis runs never overlap — outside those windows the
# entire stack uses well under 0.5 cores combined.
#
# The balancer's CPU limit should match or exceed SC_PREDICTIVE_MAX_WORKERS
# in your .env file. If you reduce the CPU limit below the worker count,
# Prophet workers will compete for cores and predictive runs will take longer.
# =============================================================================

services:
  influxdb:
    build: ./influxdb
    container_name: sc_influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${DOCKER_INFLUXDB_INIT_USERNAME}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${DOCKER_INFLUXDB_INIT_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
      - INFLUX_LONGTERM_BUCKET=${INFLUX_LONGTERM_BUCKET}
      - INFLUX_PRIMARY_RETENTION=${INFLUX_PRIMARY_RETENTION}
      - INFLUX_LONGTERM_RETENTION=${INFLUX_LONGTERM_RETENTION}
    volumes:
      - influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.25"
          memory: 768M
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: sc_grafana
    profiles:
      - tools
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    depends_on:
      influxdb:
        condition: service_healthy
    volumes:
      - grafana-data:/var/lib/grafana
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    restart: unless-stopped

  collector:
    build: ./Collector
    container_name: sc_collector
    environment:
      # HyperCore Credentials
      - SC_HOST=${SC_HOST}
      - SC_USERNAME=${SC_USERNAME}
      - SC_PASSWORD=${SC_PASSWORD}
      - SC_VERIFY_SSL=${SC_VERIFY_SSL}
      # InfluxDB Connection
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      - SC_POLL_INTERVAL=${SC_POLL_INTERVAL}
      - SC_SLOW_POLL_INTERVAL=${SC_SLOW_POLL_INTERVAL}
      - INFLUX_PRIMARY_RETENTION=${INFLUX_PRIMARY_RETENTION}
      # PostgreSQL (config store)
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_DB=hypercore_balancer
      - PG_USER=sentinel
      - PG_PASSWORD=${SENTINEL_PG_PASSWORD}
    depends_on:
      influxdb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    restart: unless-stopped

  balancer:
    build: ./Balancer
    container_name: sc_balancer
    environment:
      # HyperCore Credentials
      - SC_HOST=${SC_HOST}
      - SC_USERNAME=${SC_USERNAME}
      - SC_PASSWORD=${SC_PASSWORD}
      - SC_VERIFY_SSL=${SC_VERIFY_SSL}

      # Master Toggles
      - SC_DRY_RUN=${SC_DRY_RUN}
      - SC_VERBOSITY=${SC_VERBOSITY}

      # --- REACTIVE ENGINE TUNING ---
      - SC_AVG_WINDOW_MINUTES=${SC_AVG_WINDOW_MINUTES}
      - SC_SAMPLE_INTERVAL_SECONDS=${SC_SAMPLE_INTERVAL_SECONDS}
      - SC_RAM_LIMIT_PERCENT=${SC_RAM_LIMIT_PERCENT}
      - SC_RAM_UPPER_THRESHOLD_PERCENT=${SC_RAM_UPPER_THRESHOLD_PERCENT}
      - SC_CPU_UPPER_THRESHOLD_PERCENT=${SC_CPU_UPPER_THRESHOLD_PERCENT}
      - SC_MAX_VCPU_RATIO=${SC_MAX_VCPU_RATIO}
      - SC_VM_MOVE_COOLDOWN_MINUTES=${SC_VM_MOVE_COOLDOWN_MINUTES}
      - SC_MIGRATION_COOLDOWN_MINUTES=${SC_MIGRATION_COOLDOWN_MINUTES}
      - SC_EXCLUDE_NODE_IPS=${SC_EXCLUDE_NODE_IPS}
      - SC_CPU_TARGET_TOLERANCE_PERCENT=${SC_CPU_TARGET_TOLERANCE_PERCENT}

      # --- PREDICTIVE ENGINE TUNING (The Oracle) ---
      - SC_PREDICTIVE_BALANCING_ENABLED=${SC_PREDICTIVE_BALANCING_ENABLED}
      - SC_PREDICTIVE_INTERVAL_SECONDS=${SC_PREDICTIVE_INTERVAL_SECONDS}
      - SC_PREDICTIVE_THRESHOLD=${SC_PREDICTIVE_THRESHOLD}
      - SC_PREDICTIVE_MIN_HISTORY_HOURS=${SC_PREDICTIVE_MIN_HISTORY_HOURS}
      - SC_PREDICTIVE_LEAD_TIME_HOURS=${SC_PREDICTIVE_LEAD_TIME_HOURS}
      - SC_PREDICTIVE_LOOKBACK_DAYS=${SC_PREDICTIVE_LOOKBACK_DAYS}
      - SC_PREDICTIVE_MAX_WORKERS=${SC_PREDICTIVE_MAX_WORKERS}
      - SC_PREDICTIVE_RESERVATION_MINUTES=${SC_PREDICTIVE_RESERVATION_MINUTES}

      # Oracle InfluxDB Connection (Talks internally to the docker network)
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      # PostgreSQL (config store)
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_DB=hypercore_balancer
      - PG_USER=sentinel
      - PG_PASSWORD=${SENTINEL_PG_PASSWORD}
    depends_on:
      influxdb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    container_name: sc_dashboard
    ports:
      - "5000:5000"
    environment:
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      - SC_DASHBOARD_STALE_SECONDS=${SC_DASHBOARD_STALE_SECONDS}
      - SC_DASHBOARD_USER=${SC_DASHBOARD_USER}
      - SC_DASHBOARD_PASSWORD=${SC_DASHBOARD_PASSWORD}
      - SC_DASHBOARD_SECRET_KEY=${SC_DASHBOARD_SECRET_KEY}
      - SC_EXCLUDE_NODE_IPS=${SC_EXCLUDE_NODE_IPS}
      # PostgreSQL (config store)
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_DB=hypercore_balancer
      - PG_USER=sentinel
      - PG_PASSWORD=${SENTINEL_PG_PASSWORD}
      # Sentinel REST API (D5 what-if proxy)
      - SENTINEL_API_URL=http://sentinel:8081
      - SENTINEL_API_TOKEN=${SENTINEL_API_TOKEN:-}
    depends_on:
      influxdb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

  postgres:
    build: ./postgres
    container_name: sc_postgres
    environment:
      - POSTGRES_DB=hypercore_balancer
      - POSTGRES_USER=sentinel
      - POSTGRES_PASSWORD=${SENTINEL_PG_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d hypercore_balancer"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    restart: unless-stopped

  sentinel:
    build: ./sentinel
    container_name: sc_sentinel
    profiles:
      - sentinel
      - full
    ports:
      - "8081:8081"    # SC//Foresight REST API (F1-F4, F6)
    environment:
      # InfluxDB (read-only consumer)
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      # PostgreSQL
      - SENTINEL_PG_HOST=postgres
      - SENTINEL_PG_PORT=5432
      - SENTINEL_PG_DB=hypercore_balancer
      - SENTINEL_PG_USER=sentinel
      - SENTINEL_PG_PASSWORD=${SENTINEL_PG_PASSWORD}
      # Phase 1 forecast toggles (B1, B2)
      - SENTINEL_FORECAST_30D_ENABLED=${SENTINEL_FORECAST_30D_ENABLED:-true}
      - SENTINEL_FORECAST_90D_ENABLED=${SENTINEL_FORECAST_90D_ENABLED:-true}
      # Phase 2 strategic forecast toggles (B3, B4)
      - SENTINEL_FORECAST_180D_ENABLED=${SENTINEL_FORECAST_180D_ENABLED:-true}
      - SENTINEL_FORECAST_365D_ENABLED=${SENTINEL_FORECAST_365D_ENABLED:-true}
      # Phase 2 anomaly filter (B9)
      - SENTINEL_ANOMALY_FILTER_ENABLED=${SENTINEL_ANOMALY_FILTER_ENABLED:-true}
      # Right-sizing thresholds
      - SENTINEL_CPU_OVER_PROVISIONED_THRESHOLD=${SENTINEL_CPU_OVER_PROVISIONED_THRESHOLD:-20.0}
      - SENTINEL_CPU_UNDER_PROVISIONED_AVG_THRESHOLD=${SENTINEL_CPU_UNDER_PROVISIONED_AVG_THRESHOLD:-80.0}
      - SENTINEL_CPU_UNDER_PROVISIONED_P95_THRESHOLD=${SENTINEL_CPU_UNDER_PROVISIONED_P95_THRESHOLD:-90.0}
      - SENTINEL_ANALYSIS_WINDOW_DAYS=${SENTINEL_ANALYSIS_WINDOW_DAYS:-14}
      - SENTINEL_RECURRING_SPIKE_MIN_OCCURRENCES=${SENTINEL_RECURRING_SPIKE_MIN_OCCURRENCES:-3}
      # Data retention
      - SENTINEL_RETENTION_MONTHS=${SENTINEL_RETENTION_MONTHS:-12}
      # Collection intervals
      - SENTINEL_COLLECTION_INTERVAL_SECONDS=${SENTINEL_COLLECTION_INTERVAL_SECONDS:-300}
      - SENTINEL_TREND_INTERVAL_SECONDS=${SENTINEL_TREND_INTERVAL_SECONDS:-3600}
      # Phase 2 REST API (F1-F4, F6)
      - SENTINEL_API_PORT=8081
      - SENTINEL_API_TOKEN=${SENTINEL_API_TOKEN:-}
      # Phase 3 HyperCore credentials (C7 outcome tracking — same as Collector)
      - SC_HOST=${SC_HOST}
      - SC_USERNAME=${SC_USERNAME}
      - SC_PASSWORD=${SC_PASSWORD}
      - SC_VERIFY_SSL=${SC_VERIFY_SSL}
      # Phase 3 outcome tracker (C7)
      - SENTINEL_OUTCOME_TRACKER_ENABLED=${SENTINEL_OUTCOME_TRACKER_ENABLED:-true}
      - SENTINEL_OUTCOME_CHECK_DELAY_HOURS=${SENTINEL_OUTCOME_CHECK_DELAY_HOURS:-48}
      - SENTINEL_OUTCOME_CHECK_INTERVAL_SECONDS=${SENTINEL_OUTCOME_CHECK_INTERVAL_SECONDS:-21600}
      # Phase 3 webhook alerts (F5)
      - SENTINEL_WEBHOOK_ENABLED=${SENTINEL_WEBHOOK_ENABLED:-true}
      - SENTINEL_WEBHOOK_URL=${SENTINEL_WEBHOOK_URL:-}
      - SENTINEL_WEBHOOK_SECRET=${SENTINEL_WEBHOOK_SECRET:-}
      - SENTINEL_WEBHOOK_TIMEOUT_SECONDS=${SENTINEL_WEBHOOK_TIMEOUT_SECONDS:-10}
      - SENTINEL_WEBHOOK_MAX_RETRIES=${SENTINEL_WEBHOOK_MAX_RETRIES:-3}
      - SENTINEL_WEBHOOK_LOOKBACK_HOURS=${SENTINEL_WEBHOOK_LOOKBACK_HOURS:-24}
      - SENTINEL_WEBHOOK_DISPATCH_INTERVAL_SECONDS=${SENTINEL_WEBHOOK_DISPATCH_INTERVAL_SECONDS:-60}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      influxdb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    restart: unless-stopped

volumes:
  influxdb-data:
  grafana-data:
  postgres-data:
